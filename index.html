<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSHATRIYA SEOS // CORE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0d11; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: linear-gradient(90deg, #1e1b4b, #0f172a); padding: 18px; text-align: center; border-bottom: 2px solid #312e81; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        header h1 { font-size: 1.6rem; letter-spacing: 3px; color: #6366f1; text-transform: uppercase; font-weight: 800; text-shadow: 0 0 10px rgba(99,102,241,0.5); }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: radial-gradient(circle at center, #111827 0%, #090d16 100%); }
        .message { max-width: 85%; padding: 14px 18px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; animation: fadeIn 0.3s ease-in-out; }
        .user-message { background-color: #312e81; color: #f8fafc; align-self: flex-end; border-bottom-right-radius: 2px; border: 1px solid #4338ca; }
        .ai-message { background-color: #1f2937; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #374151; }
        .ai-message bold, .ai-message strong { color: #818cf8; font-weight: 700; }
        #input-container { background-color: #111827; padding: 15px; border-top: 2px solid #1f2937; display: flex; gap: 12px; }
        textarea { flex: 1; background-color: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 12px; color: #fff; resize: none; height: 48px; font-size: 0.95rem; outline: none; transition: border 0.2s; }
        textarea:focus { border-color: #6366f1; box-shadow: 0 0 8px rgba(99,102,241,0.3); }
        button { background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); color: white; border: none; border-radius: 8px; width: 80px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.96); }
        button:disabled { background: #374151; cursor: not-allowed; opacity: 0.6; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <h1>Kshatriya SEOS Core</h1>
    </header>

    <div id="chat-container">
        <div class="message ai-message"><strong>[SYSTEM INITIALIZED]</strong> Core engine online. State your target, define your battlefield. Execution parameter locked.</div>
    </div>

    <div id="input-container">
        <textarea id="user-input" placeholder="Enter execution prompt..."></textarea>
        <button id="send-btn">RUN</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Cloudflare Worker Live API Endpoint
        const API_URL = 'https://kshatriya-ai-bridge.solankipriyam71.workers.dev';

        // Static Execution Profile Matrix Context
        const userContext = {
            profile: "Kshatriya Elite",
            focus: ["High-Ticket Freelance", "Premium Video Editing Pipelines", "Mass Scale PW Distribution Loops"],
            rules: "Zero corporate fluff. Absolute tactical blueprints only."
        };

        function appendMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            msgDiv.innerHTML = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function triggerExecution() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, true);
            userInput.value = '';
            userInput.style.height = '48px';
            
            sendBtn.disabled = true;
            
            // Temporary typing notification
            const loaderDiv = document.createElement('div');
            loaderDiv.className = 'message ai-message';
            loaderDiv.innerText = '[COMPUTING PIPELINE...]';
            chatContainer.appendChild(loaderDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text, context: userContext })
                });

                const data = await response.json();
                loaderDiv.remove();

                if (data.reply) {
                    // Convert basic markdown asterisks to html bold tags safely
                    let formattedReply = data.reply.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    appendMessage(formattedReply, false);
                } else if (data.error) {
                    appendMessage(`[CORE ERROR]: ${data.error}`, false);
                } else {
                    appendMessage('[UNEXPECTED RESPONSE STRUCT ERROR]', false);
                }
            } catch (err) {
                loaderDiv.remove();
                appendMessage(`[NETWORK CORE FAILURE]: ${err.message}`, false);
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', triggerExecution);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                triggerExecution();
            }
        });
    </script>
</body>
</html>
